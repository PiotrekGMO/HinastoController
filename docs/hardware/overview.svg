<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>How the parts of Hinasto Controller fit together</title>
  <rect width="960" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">How it fits together</text>

  <!-- heater + remote -->
  <rect x="30" y="80" width="170" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="115" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Diesel heater</text>
  <text x="115" y="138" text-anchor="middle" font-size="12" fill="#92400e">"Webasto 8 kW" clone</text>
  <text x="115" y="156" text-anchor="middle" font-size="12" fill="#92400e">with its own remote</text>
  <text x="115" y="174" text-anchor="middle" font-size="12" fill="#92400e">(V1 protocol)</text>

  <!-- controller -->
  <rect x="290" y="80" width="190" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="385" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Controller</text>
  <text x="385" y="138" text-anchor="middle" font-size="12" fill="#166534">ESP32-S2 mini</text>
  <text x="385" y="156" text-anchor="middle" font-size="12" fill="#166534">+ CC1101 radio</text>
  <text x="385" y="174" text-anchor="middle" font-size="12" fill="#166534">+ DHT22 room sensor</text>

  <!-- server -->
  <rect x="570" y="80" width="170" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="655" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Server</text>
  <text x="655" y="138" text-anchor="middle" font-size="12" fill="#1e3a8a">PHP + MySQL / MariaDB</text>
  <text x="655" y="156" text-anchor="middle" font-size="12" fill="#1e3a8a">your own host,</text>
  <text x="655" y="174" text-anchor="middle" font-size="12" fill="#1e3a8a">HTTPS</text>

  <!-- phone -->
  <rect x="830" y="80" width="100" height="120" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="880" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#6b21a8">Panel</text>
  <text x="880" y="138" text-anchor="middle" font-size="12" fill="#6b21a8">browser or</text>
  <text x="880" y="156" text-anchor="middle" font-size="12" fill="#6b21a8">phone app</text>

  <!-- links -->
  <g stroke="#374151" stroke-width="2.5" fill="none">
    <line x1="210" y1="140" x2="280" y2="140" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="490" y1="140" x2="560" y2="140" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="750" y1="140" x2="820" y2="140" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="245" y="126">433 MHz</text><text x="245" y="170">radio</text>
    <text x="525" y="126">WiFi</text><text x="525" y="170">every 3 s</text>
    <text x="785" y="126">HTTPS</text><text x="785" y="170">web page</text>
  </g>

  <g font-size="13" fill="#111827">
    <text x="30" y="250">1. The controller talks to the heater like its remote does: it polls the state and sends the same buttons.</text>
    <text x="30" y="272">2. It reports state and log to your server and fetches the commands you gave in the panel.</text>
    <text x="30" y="294">3. The panel shows every heater, switches it, and the smart mode keeps a room at a target temperature.</text>
  </g>
</svg>
